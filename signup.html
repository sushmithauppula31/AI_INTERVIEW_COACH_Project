
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Interview Coach | Sign Up</title>
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>
<div class="container">
 <h1>🎙️ AI Interview Coach</h1>
 <p class="subtitle">Create your account and start practicing</p>

 <form id="signupForm">
  <label for="name">Full Name</label>
  <input type="text" id="name" placeholder="Enter your name" required>

  <label for="email">Email</label>
  <input type="email" id="email" placeholder="Enter your email" required>

  <label for="password">Password</label>
  <input type="password" id="password" placeholder="Create a password" minlength="6" required>

  <label for="confirmPassword">Confirm Password</label>
  <input type="password" id="confirmPassword" placeholder="Re-enter your password" required>

  <button type="submit">Create Account</button>
 </form>

 <p id="message"></p>
 <p class="bottom">Already have an account? <a href="login.html">Login</a></p>
</div>
  <script src="js/signup.js"></script>
</body>
</html>
